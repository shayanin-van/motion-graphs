<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1D Motion Graphs</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Space Mono"
    />
    <script type="module" crossorigin src="/assets/index-D6sWCbaT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DejVfwOU.css">
  </head>
  <body>
    <canvas class="webgl"></canvas>
    <!-- ponytail: dismiss is per-page-load; add localStorage if users report it nagging -->
    <div class="small-screen-notice">
      <span>Best viewed on a larger screen — try a laptop, desktop, or tablet in landscape.</span>
      <button type="button" onclick="this.parentElement.remove()">Got it</button>
    </div>
    <script>
      // A small frame is fixed by fullscreen; a small device is not. Offer the
      // button while it is still worth tapping, then fall back to the device
      // advice. On a laptop the media query hides the banner at that point
      // anyway -- only a phone stays cramped after going fullscreen.
      (function () {
        var span = document.querySelector(".small-screen-notice span");
        var device = span.textContent;
        function setCopy() {
          span.textContent =
            window.self !== window.top &&
            document.fullscreenEnabled &&
            !document.fullscreenElement
              ? "Tap the fullscreen button, bottom right, for more room."
              : device;
        }
        setCopy();
        document.addEventListener("fullscreenchange", setCopy);
      })();
    </script>
  </body>
</html>
